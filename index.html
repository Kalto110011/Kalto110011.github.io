
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Wheel Fitment Sim | ホイールオフセット・キャンバーによる出面自動計算ツール </title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --current-color: #2563eb; /* 青 */
            --new-color: #dc2626;     /* 赤 */
            --border-color: #e5e7eb;
            --accent-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 24px;
            color: #1e293b;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 650px) {
            .grid-inputs {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            background-color: var(--accent-bg);
        }

        .input-group.current { border-top: 4px solid var(--current-color); }
        .input-group.new { border-top: 4px solid var(--new-color); }

        .input-group h2 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group.current h2 { color: var(--current-color); }
        .input-group.new h2 { color: var(--new-color); }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .form-row:last-child { margin-bottom: 0; }

        .form-row label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-row input, .form-row select {
            width: 140px;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-row input {
            text-align: right;
        }

        /* グラフィックエリア */
        .visual-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        svg {
            max-width: 100%;
            height: auto;
            background: #fafafa;
            border-radius: 4px;
        }

        /* 💡 ドットの解説文スタイル */
        .explanation-box {
            width: 100%;
            margin-top: 12px;
            padding: 12px 16px;
            background-color: #f0fdf4;
            border-left: 4px solid #16a34a;
            border-radius: 0 4px 4px 0;
            font-size: 13px;
            color: #166534;
        }

        .explanation-box strong {
            display: block;
            margin-bottom: 4px;
            color: #14532d;
        }

        /* リザルトパネル */
        .result-panel {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            background-color: #f8fafc;
            text-align: center;
        }

        .result-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .result-flex {
            display: flex;
            justify-content: space-around;
            gap: 16px;
        }

        @media (max-width: 480px) {
            .result-flex {
                flex-direction: column;
                gap: 12px;
            }
        }

        .result-box {
            flex: 1;
            background: #ffffff;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .result-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        /* モバイル用の改行コントロールを含む数値デザイン */
        .result-value {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.3;
        }

        .result-value .unit {
            font-size: 14px;
            font-weight: normal;
            color: var(--text-muted);
            margin-right: 4px;
        }

        /* 方向テキスト（外に出ます / 内に入ります）のラッパー */
        .direction-text {
            font-size: 16px;
            font-weight: bold;
        }
        
        .direction-text.out { color: #dc2626; }
        .direction-text.in { color: #2563eb; }
        .direction-text.keep { color: var(--text-muted); }

        /* モバイル専用改行タグ */
        .mobile-br {
            display: none;
        }

        @media (max-width: 480px) {
            .mobile-br {
                display: block;
            }
            .result-value {
                font-size: 20px;
            }
            .direction-text {
                font-size: 15px;
                display: block;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>足回り形式対応・ツライチ出幅計算シミュレーター</h1>

    <div class="grid-inputs">
        <div class="input-group current">
            <h2>● 現在の仕様 (青)</h2>
            <div class="form-row">
                <label>タイヤ幅 (mm)</label>
                <input type="number" id="cur_tire" value="215" step="10">
            </div>
            <div class="form-row">
                <label>リム径 (インチ)</label>
                <input type="number" id="cur_dia" value="16" step="1">
            </div>
            <div class="form-row">
                <label>リム幅 (J)</label>
                <input type="number" id="cur_rim" value="8.0" step="0.5">
            </div>
            <div class="form-row">
                <label>インセット (mm)</label>
                <input type="number" id="cur_inset" value="45" step="1">
            </div>
            <div class="form-row">
                <label>足回りオプション</label>
                <select id="cur_susp">
                    <option value="axle">アクスル (ハブ中心軸)</option>
                    <option value="multi_up">マルチリンク: アッパーアーム</option>
                    <option value="multi_low">マルチリンク: ロアアーム</option>
                    <option value="strut_up">ストラット: アッパーアーム</option>
                    <option value="strut_low">ストラット: ロアアーム延長</option>
                </select>
            </div>
            <div class="form-row">
                <label>キャンバー角 (度)</label>
                <input type="number" id="cur_cam" value="0.0" step="0.5" min="0" max="20">
            </div>
        </div>

        <div class="input-group new">
            <h2>● 変更案 (赤)</h2>
            <div class="form-row">
                <label>タイヤ幅 (mm)</label>
                <input type="number" id="new_tire" value="225" step="10">
            </div>
            <div class="form-row">
                <label>リム径 (インチ)</label>
                <input type="number" id="new_dia" value="16" step="1">
            </div>
            <div class="form-row">
                <label>リム幅 (J)</label>
                <input type="number" id="new_rim" value="9.0" step="0.5">
            </div>
            <div class="form-row">
                <label>インセット (mm)</label>
                <input type="number" id="new_inset" value="35" step="1">
            </div>
            <div class="form-row">
                <label>足回りオプション</label>
                <select id="new_susp">
                    <option value="strut_low" selected>ストラット: ロアアーム延長</option>
                    <option value="multi_up">マルチリンク: アッパーアーム</option>
                    <option value="multi_low">マルチリンク: ロアアーム</option>
                    <option value="strut_up">ストラット: アッパーアーム</option>
                    <option value="axle">アクスル (ハブ中心軸)</option>
                </select>
            </div>
            <div class="form-row">
                <label>キャンバー角 (度)</label>
                <input type="number" id="new_cam" value="3.0" step="0.5" min="0" max="20">
            </div>
        </div>
    </div>

    <div class="visual-area">
        <svg id="preview" width="500" height="320" viewBox="0 0 500 320">
            </svg>
        
        <div class="explanation-box">
            <strong>💡 点（●）の表示について</strong>
            図の中の点（●）は、それぞれの足回り形式・キャンバー角において<strong>最も外側・内側に突出している（出っ張っている）部分</strong>を自動判定したものです。当ツールはこの点同士の距離（フェンダー水平基準）を元に出幅の差分を計算しています。
        </div>
    </div>

    <div class="result-panel">
        <div class="result-title">現在の仕様 からの計算結果 (フェンダー頂点・水平ライン基準)</div>
        <div class="result-flex">
            <div class="result-box">
                <div class="result-label">アウター側（外ツラトップ変化）</div>
                <div class="result-value" id="outer_result">
                    <span class="num">0.0</span><span class="unit">mm</span><br class="mobile-br"><span class="direction-text">変化なし</span>
                </div>
            </div>
            <div class="result-box">
                <div class="result-label">インナー側（サス・アーム干渉変化）</div>
                <div class="result-value" id="inner_result">
                    <span class="num">0.0</span><span class="unit">mm</span><br class="mobile-br"><span class="direction-text">変化なし</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const inputs = [
        'cur_tire', 'cur_dia', 'cur_rim', 'cur_inset', 'cur_susp', 'cur_cam',
        'new_tire', 'new_dia', 'new_rim', 'new_inset', 'new_susp', 'new_cam'
    ].reduce((acc, id) => ({ ...acc, [id]: document.getElementById(id) }), {});

    const svg = document.getElementById('preview');

    function calculateAndDraw() {
        const cTire = parseFloat(inputs.cur_tire.value) || 0;
        const cDia = parseFloat(inputs.cur_dia.value) || 0;
        const cRim = parseFloat(inputs.cur_rim.value) || 0;
        const cInset = parseFloat(inputs.cur_inset.value) || 0;
        const cSusp = inputs.cur_susp.value;
        const cCam = parseFloat(inputs.cur_cam.value) || 0;

        const nTire = parseFloat(inputs.new_tire.value) || 0;
        const nDia = parseFloat(inputs.new_dia.value) || 0;
        const nRim = parseFloat(inputs.new_rim.value) || 0;
        const nInset = parseFloat(inputs.new_inset.value) || 0;
        const nSusp = inputs.new_susp.value;
        const nCam = parseFloat(inputs.new_cam.value) || 0;

        const scale = 0.55; 
        const centerX = 250; 
        const centerY = 160; 

        function getSpecExtremes(tire, dia, rim, inset, susp, cam) {
            const rimWidthMm = rim * 25.4;
            const rimDiaMm = dia * 25.4;
            const tireWidthMm = tire;
            
            const wCX = centerX + (inset * scale);

            const rTopY = centerY - (rimDiaMm / 2) * scale;
            const rBotY = centerY + (rimDiaMm / 2) * scale;
            const rLeftX = wCX - (rimWidthMm / 2) * scale;
            const rRightX = wCX + (rimWidthMm / 2) * scale;

            const tTopY = rTopY - 45 * scale; 
            const tLeftX = wCX - (tireWidthMm / 2) * scale;
            const tRightX = wCX + (tireWidthMm / 2) * scale;

            let points = [
                {x: rLeftX, y: rTopY, type: 'rim'},   
                {x: rRightX, y: rTopY, type: 'rim'},  
                {x: rLeftX, y: rBotY, type: 'rim'},   
                {x: rRightX, y: rBotY, type: 'rim'},  
                {x: tLeftX, y: rTopY - 10 * scale, type: 'tire'}, 
                {x: tRightX, y: rTopY - 10 * scale, type: 'tire'},
                {x: wCX, y: tTopY, type: 'tire'}      
            ];

            // 支点 (Pivot) の決定
            let px = centerX;
            let py = centerY;

            if (susp.startsWith('multi')) {
                const knuckleHeight = (dia - 1) * 25.4 * scale;
                if (susp === 'multi_up') {
                    py = centerY + (knuckleHeight / 2); // アッパー調整 ＝ 支点は下
                } else {
                    py = centerY - (knuckleHeight / 2); // ロア調整 ＝ 支点は上
                }
            } else if (susp === 'strut_up') {
                py = rBotY; // ストラットアッパー ＝ 下側リム基準
            } else if (susp === 'strut_low') {
                py = rTopY; // 💡 ストラットロア延長 ＝ 上側リム基準（アッパーマウントが不動軸のため）
            } else if (susp === 'axle') {
                py = centerY; // アクスル ＝ ハブ中心
            }

            const angleRad = (cam * Math.PI) / 180;
            const cos = Math.cos(angleRad);
            const sin = Math.sin(angleRad);

            let rotatedPoints = points.map(p => {
                const rx = (p.x - px) * cos - (p.y - py) * sin + px;
                const ry = (p.x - px) * sin + (p.y - py) * cos + py;
                return { x: rx, y: ry, type: p.type };
            });

            // フェンダー頂点（上半分）でのツラ測定点をソート抽出
            const upperPoints = rotatedPoints.filter(p => p.y < centerY + 20);
            
            let maxOuter = Infinity; 
            let maxInner = -Infinity; 
            let outPt = upperPoints[0];
            let inPt = upperPoints[0];

            upperPoints.forEach(p => {
                if (p.x < maxOuter) { maxOuter = p.x; outPt = p; }
                if (p.x > maxInner) { maxInner = p.x; inPt = p; }
            });

            return { outPt, inPt, rotatedPoints, pivot: {x: px, y: py}, wCX, rTopY, rBotY, rLeftX, rRightX, tTopY, tLeftX, tRightX, rimWidthMm, tireWidthMm };
        }

        const curData = getSpecExtremes(cTire, cDia, cRim, cInset, cSusp, cCam);
        const newData = getSpecExtremes(nTire, nDia, nRim, nInset, nSusp, nCam);

        const outerDiff = (curData.outPt.x - newData.outPt.x) / scale;
        const innerDiff = (newData.inPt.x - curData.inPt.x) / scale;

        updateResultElement('outer_result', outerDiff, '外に出ます', '内に入ります');
        updateResultElement('inner_result', innerDiff, '内（サス側）へ近づきます', '外（サス側）から遠ざかります');

        drawAll(curData, newData, scale, centerX, centerY);
    }

    function updateResultElement(elementId, diff, positiveText, negativeText) {
        const container = document.getElementById(elementId);
        let dirClass = 'keep';
        let dirText = '変化なし';

        if (diff > 0.05) {
            dirClass = 'out';
            dirText = positiveText;
        } else if (diff < -0.05) {
            dirClass = 'in';
            dirText = negativeText;
        }

        container.innerHTML = `<span class="num">${diff > 0 ? '+' : ''}${diff === 0 ? '0.0' : diff.toFixed(1)}</span><span class="unit">mm</span><br class="mobile-br"><span class="direction-text ${dirClass}">${dirText}</span>`;
    }

    function drawAll(cur, nxt, scale, cx, cy) {
        svg.innerHTML = ''; 

        // センターライン
        createLine(cx, 10, cx, 300, '#cbd5e1', '2,2');

        function renderSpec(d, color, opacity, cam) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('transform', `rotate(${cam}, ${d.pivot.x}, ${d.pivot.y})`);
            g.setAttribute('opacity', opacity);

            const rimH = 10 * scale;
            createRect(d.rLeftX, d.rTopY, d.rimWidthMm * scale, rimH, color, g);
            createRect(d.rLeftX, d.rBotY - rimH, d.rimWidthMm * scale, rimH, color, g);
            createLine(cx + (d.rLeftX - d.rRightX)/4, d.rTopY, cx + (d.rLeftX - d.rRightX)/4, d.rBotY, color, '0', 2, g);

            const isStretched = d.tireWidthMm <= d.rimWidthMm;
            let pathData = '';
            if (isStretched) {
                pathData = `M ${d.rLeftX} ${d.rTopY} C ${d.rLeftX + 8} ${d.tTopY + 12}, ${d.tLeftX} ${d.tTopY}, ${d.wCX} ${d.tTopY} S ${d.rRightX - 8} ${d.tTopY + 12}, ${d.rRightX} ${d.rTopY} Z`;
            } else {
                pathData = `M ${d.rLeftX} ${d.rTopY} C ${d.tLeftX} ${d.rTopY - 5}, ${d.tLeftX} ${d.tTopY}, ${d.wCX} ${d.tTopY} S ${d.tRightX} ${d.rTopY - 5}, ${d.rRightX} ${d.rTopY} Z`;
            }
            createPath(pathData, color, g);
            svg.appendChild(g);

            createCircle(d.outPt.x, d.outPt.y, 5, color);
            createCircle(d.inPt.x, d.inPt.y, 5, color);
        }

        renderSpec(cur, '#2563eb', 0.35, parseFloat(inputs.cur_cam.value)||0);
        renderSpec(nxt, '#dc2626', 0.85, parseFloat(inputs.new_cam.value)||0);

        createLegend(25, 30, '#2563eb', '現在の最突出点 (●)');
        createLegend(25, 55, '#dc2626', '変更案の最突出点 (●)');
    }

    function createLine(x1, y1, x2, y2, color, dash = '0', width = 1, parent = svg) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        line.setAttribute('stroke', color); line.setAttribute('stroke-width', width);
        if (dash !== '0') line.setAttribute('stroke-dasharray', dash);
        parent.appendChild(line);
    }

    function createRect(x, y, w, h, color, parent = svg) {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y); rect.setAttribute('width', w); rect.setAttribute('height', h);
        rect.setAttribute('fill', 'none'); rect.setAttribute('stroke', color); rect.setAttribute('stroke-width', 1.5);
        parent.appendChild(rect);
    }

    function createPath(data, color, parent = svg) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', data); path.setAttribute('fill', 'none'); path.setAttribute('stroke', color); path.setAttribute('stroke-width', 2);
        parent.appendChild(path);
    }

    function createCircle(cx, cy, r, color) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', r);
        circle.setAttribute('fill', color); circle.setAttribute('stroke', '#ffffff'); circle.setAttribute('stroke-width', 1.5);
        svg.appendChild(circle);
    }

    function createLegend(x, y, color, text) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x); circle.setAttribute('cy', y - 4); circle.setAttribute('r', 5); circle.setAttribute('fill', color);
        svg.appendChild(circle);
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', x + 15); txt.setAttribute('y', y); txt.setAttribute('fill', '#333333'); txt.setAttribute('font-size', '12px'); txt.textContent = text;
        svg.appendChild(txt);
    }

    document.addEventListener('DOMContentLoaded', () => {
        calculateAndDraw();
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', calculateAndDraw);
            input.addEventListener('change', calculateAndDraw);
        });
    });
</script>

</body>
</html>
