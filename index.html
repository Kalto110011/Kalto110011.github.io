<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BQKHCPRJNG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BQKHCPRJNG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Fitment Sim | ホイール出幅自動計算ツール</title>
    <style>
        :root {
            --bg-image: url('bg.png'); 
            --bg-color: #0f0f0f;
            --card-bg: rgba(26, 26, 26, 0.93);
            --text-color: #e0e0e0;
            --accent-color: #ff4500;
            --compare-color: #00bfff;
            --new-spec-color: #e74c3c;
            --border-color: #333;
        }
        
        body { 
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: sans-serif; 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 90px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .container { 
            max-width: 850px; 
            width: 100%; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            border: 1px solid var(--border-color); 
            box-sizing: border-box;
            backdrop-filter: blur(5px); 
        }
        
        h1 { text-align: center; color: #fff; font-size: 1.6rem; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; margin-top: 0; margin-bottom: 25px; }
        
        .columns { display: flex; gap: 20px; margin-bottom: 20px; }
        .column { flex: 1; background: rgba(34, 34, 34, 0.85); padding: 15px; border-radius: 8px; border: 1px solid #444; }
        
        .column-title { font-weight: bold; margin-bottom: 15px; color: #fff; text-align: center; font-size: 0.9rem; }
        .input-group { margin-bottom: 10px; }
        .tire-inputs { display: flex; gap: 5px; }
        .tire-inputs input { text-align: center; }
        label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: #aaa; }
        input { width: 100%; padding: 8px; background: #111; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 1rem; box-sizing: border-box; }
        input:focus { border-color: var(--accent-color); outline: none; }
        
        /* 描画エリア & ズームボタン */
        .visual-area { position: relative; background: #ffffff; padding: 0; border-radius: 8px; margin-bottom: 25px; height: 350px; border: 1px solid #ccc; overflow: hidden; }
        .viz-label { position: absolute; top: 10px; left: 0; width: 100%; font-size: 0.8rem; font-weight: bold; color: #333; text-align: center; z-index: 5; pointer-events: none; }
        .pane { height: 100%; box-sizing: border-box; position: relative; }
        .pane-label { position: absolute; top: 15px; width: 100%; text-align: center; font-size: 0.75rem; font-weight: bold; z-index: 5; pointer-events: none; }
        .wheel-assembly { position: absolute; transition: transform 0.1s ease-out, left 0.2s ease-out, top 0.2s ease-out; mix-blend-mode: multiply; }
        
        .visual-area.mode-layered { display: block; }
        .visual-area.mode-layered .pane { position: absolute; top: 0; left: 0; width: 100%; }
        .visual-area.mode-layered .pane-label { display: none; } 
        .visual-area.mode-layered .viz-label { display: block; }

        .visual-area.mode-side { display: flex; }
        .visual-area.mode-side .pane { flex: 1; }
        .visual-area.mode-side #curPane { border-right: 1px dashed #ccc; }
        .visual-area.mode-side .pane-label { display: block; } 
        .visual-area.mode-side .viz-label { display: none; }

        .zoom-controls { position: absolute; bottom: 15px; right: 15px; display: flex; gap: 6px; z-index: 20; }
        .zoom-controls button { width: 36px; height: 36px; background: rgba(0, 0, 0, 0.75); border: 1px solid #555; color: #fff; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; }
        .zoom-controls button:active { background: var(--accent-color); border-color: var(--accent-color); }

        /* トースト通知 */
        #toast { visibility: hidden; min-width: 280px; background-color: rgba(30, 30, 30, 0.95); color: #fff; text-align: center; border-radius: 8px; padding: 12px 16px; position: fixed; z-index: 2000; top: 20px; left: 50%; transform: translateX(-50%); font-size: 0.85rem; font-weight: bold; transition: opacity 0.4s, transform 0.4s; opacity: 0; border: 1px solid var(--accent-color); box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: none; }
        #toast.show { visibility: visible; opacity: 1; transform: translate(-50%, 10px); }

        /* 下に伸びるアコーディオン型プルダウン */
        .dropdown-box { margin-bottom: 15px; width: 100%; }
        .dropdown-trigger { background: rgba(34, 34, 34, 0.85); border: 1px solid #444; padding: 12px 15px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.95rem; color: #fff; user-select: none; box-sizing: border-box; }
        .dropdown-trigger:hover { border-color: #666; }
        .dropdown-box.calc-opt .dropdown-trigger { border-left: 4px solid var(--accent-color); }
        .dropdown-box.view-opt .dropdown-trigger { border-left: 4px solid var(--compare-color); }
        
        .dropdown-content { display: none; background: rgba(20, 20, 20, 0.95); border: 1px solid #444; border-radius: 8px; padding: 5px 15px; margin-top: 5px; box-sizing: border-box; }
        .dropdown-content.show { display: block; }
        
        .option-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; width: 100%; }
        .option-item:not(:last-child) { border-bottom: 1px solid #333; }
        .dropdown-content input[type="radio"], .dropdown-content input[type="checkbox"] { width: auto; cursor: pointer; transform: scale(1.2); margin: 0; }
        .dropdown-content label { display: inline; font-size: 0.9rem; color: #fff; cursor: pointer; font-weight: bold; }
        .dropdown-content .description { font-size: 0.8rem; color: #888; font-weight: normal; margin-left: 5px; }

        /* リザルトパネル */
        .result-panel { background: rgba(17, 17, 17, 0.95); box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; box-sizing: border-box; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .sheet-toggle { height: 50px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #fff; font-weight: bold; font-size: 1rem; background: #1a1a1a; }
        .result-item { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid #333; font-size: 0.95rem; }
        .result-item:last-child { border-bottom: none; }
        .result-title { display: flex; justify-content: space-between; margin-bottom: 5px; color: #ccc;}
        .diff-val { font-weight: bold; font-size: 1.1rem; }
        .abs-val { font-size: 0.8rem; color: #aaa; text-align: right; }

        @media (max-width: 767px) {
            .columns { flex-direction: column; }
            .result-panel { position: fixed; bottom: 0; left: 0; width: 100%; border-top: 3px solid var(--accent-color); border-radius: 20px 20px 0 0; transform: translateY(calc(100% - 50px)); }
            .result-panel.open { transform: translateY(0); }
            .sheet-toggle { border-radius: 20px 20px 0 0; position: relative; }
            .sheet-toggle::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 5px; background: #666; border-radius: 3px; }
            .sheet-content { padding: 10px 25px 35px 25px; }
        }

        @media (min-width: 768px) {
            .result-panel { position: fixed; top: 25px; right: 25px; width: 340px; border: 1px solid var(--border-color); border-top: 4px solid var(--accent-color); border-radius: 8px; overflow: hidden; }
            .sheet-toggle { height: 45px; font-size: 0.95rem; }
            .sheet-content { padding: 5px 20px 15px 20px; transition: max-height 0.3s ease-out, opacity 0.3s ease-out; max-height: 400px; opacity: 1; }
            .result-panel.pc-closed .sheet-content { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; pointer-events: none; }
        }
    </style>
</head>
<body>

<div id="toast"></div>

<div class="container">
    <h1>Wheel Fitment Sim</h1>

    <div id="visualArea" class="visual-area mode-layered">
        <div class="viz-label">現在 (青) ⇔ 変更案 (赤)</div>
        <div id="curPane" class="pane">
            <div class="pane-label" style="color: #2980b9;">【前】現在の仕様</div>
            <div id="curAssembly" class="wheel-assembly" style="z-index: 2;"></div>
        </div>
        <div id="newPane" class="pane">
            <div class="pane-label" style="color: #c0392b;">【後】変更案</div>
            <div id="newAssembly" class="wheel-assembly" style="z-index: 3;"></div>
        </div>
        
        <div class="zoom-controls">
            <button onclick="changeZoom(0.25)">＋</button>
            <button onclick="resetZoom()">・</button>
            <button onclick="changeZoom(-0.25)">ー</button>
        </div>
    </div>

    <div class="dropdown-box calc-opt">
        <div class="dropdown-trigger" onclick="toggleDropdown('calcDropdown', event)">
            <span> 計算・測定オプション</span>
            <span class="arrow">▼</span>
        </div>
        <div id="calcDropdown" class="dropdown-content" onclick="event.stopPropagation()">
            <div class="option-item">
                <input type="checkbox" id="isStrut">
                <label for="isStrut">ストラット式サスペンション<span class="description">(アッパー側で調整する場合)</span></label>
            </div>
            <div class="option-item">
                <input type="radio" name="calcBase" id="baseRim" value="rim" checked>
                <label for="baseRim">リム基準 <span class="description">(ホイール最外側ベースで測定)</span></label>
            </div>
            <div class="option-item">
                <input type="radio" name="calcBase" id="baseTire" value="tire">
                <label for="baseTire">タイヤ基準 <span class="description">(ショルダー最外側ベースで測定)</span></label>
            </div>
        </div>
    </div>

    <div class="dropdown-box view-opt">
        <div class="dropdown-trigger" onclick="toggleDropdown('viewDropdown', event)">
            <span> 表示オプション</span>
            <span class="arrow">▼</span>
        </div>
        <div id="viewDropdown" class="dropdown-content" onclick="event.stopPropagation()">
            <div class="option-item">
                <input type="radio" name="viewMode" id="modeLayered" value="layered" checked>
                <label for="modeLayered">重ねて表示</label>
            </div>
            <div class="option-item">
                <input type="radio" name="viewMode" id="modeSide" value="side">
                <label for="modeSide">左右に並べて表示</label>
            </div>
            <div class="option-item">
                <input type="checkbox" id="showHubLine" checked>
                <label for="showHubLine">ハブ基準線 (点線) を表示する</label>
            </div>
        </div>
    </div>

    <div class="columns">
        <div class="column current-spec">
            <div class="column-title" style="color: var(--compare-color);">🔹 現在の仕様</div>
            <div class="input-group"><label>J数</label><input type="text" id="curJ" value="8.5"></div>
            <div class="input-group"><label>インセット</label><input type="text" id="curInset" value="45"></div>
            <div class="input-group"><label>スペーサー</label><input type="text" id="curSpacer" value="0"></div>
            <div class="input-group"><label>キャンバー (度)</label><input type="text" id="curCamber" value="1"></div>
            <div class="input-group">
                <label>タイヤサイズ (幅 / 扁平 / インチ)</label>
                <div class="tire-inputs">
                    <input type="text" id="curTWidth" value="225">
                    <input type="text" id="curTRatio" value="40">
                    <input type="text" id="curTInch" value="18">
                </div>
            </div>
        </div>
        
        <div class="column new-spec">
            <div class="column-title" style="color: var(--new-spec-color);">🔸 変更案</div>
            <div class="input-group"><label>J数</label><input type="text" id="newJ" value="10.0"></div>
            <div class="input-group"><label>インセット</label><input type="text" id="newInset" value="20"></div>
            <div class="input-group"><label>スペーサー</label><input type="text" id="newSpacer" value="0"></div>
            <div class="input-group"><label>キャンバー (度)</label><input type="text" id="newCamber" value="3.5"></div>
            <div class="input-group">
                <label>タイヤサイズ (幅 / 扁平 / インチ)</label>
                <div class="tire-inputs">
                    <input type="text" id="newTWidth" value="215">
                    <input type="text" id="newTRatio" value="35">
                    <input type="text" id="newTInch" value="18">
                </div>
            </div>
        </div>
    </div>
</div>

<div id="bottomSheet" class="result-panel">
    <div class="sheet-toggle" onclick="toggleResultPanel()">
        <span id="toggleText">▼ 計算結果を閉じる</span>
    </div>
    <div class="sheet-content">
        <div class="result-item">
            <div class="result-title"><span id="textOuterTitle">アウター側</span><span class="diff-val" id="diffOuter">--</span></div>
            <div class="abs-val" id="absOuter">ハブ面〜最外側の距離: -- mm</div>
        </div>
        <div class="result-item">
            <div class="result-title"><span id="textInnerTitle">インナー側</span><span class="diff-val" id="diffInner">--</span></div>
            <div class="abs-val" id="absInner">ハブ面〜最内側の距離: -- mm</div>
        </div>
        <div class="result-item">
            <div class="result-title"><span>車高の変化（タイヤ半径差）</span><span class="diff-val" id="diffHeight">--</span></div>
        </div>
    </div>
</div>

<script>
    let zoomLevel = 1.0;
    let toastTimeout = null;

    window.addEventListener('DOMContentLoaded', setupToggleText);
    window.addEventListener('resize', setupToggleText);

    function toggleDropdown(id, event) {
        event.stopPropagation();
        const target = document.getElementById(id);
        const isShow = target.classList.contains('show');
        
        document.querySelectorAll('.dropdown-content').forEach(el => {
            el.classList.remove('show');
            const trigger = el.previousElementSibling;
            if (trigger) trigger.querySelector('.arrow').innerText = '▼';
        });
        
        const currentTrigger = target.previousElementSibling;
        if (!isShow) {
            target.classList.add('show');
            if (currentTrigger) currentTrigger.querySelector('.arrow').innerText = '▲';
        } else {
            if (currentTrigger) currentTrigger.querySelector('.arrow').innerText = '▼';
        }
    }

    window.addEventListener('click', function() {
        document.querySelectorAll('.dropdown-content').forEach(el => {
            el.classList.remove('show');
            const trigger = el.previousElementSibling;
            if (trigger) trigger.querySelector('.arrow').innerText = '▼';
        });
    });

    function setupToggleText() {
        const text = document.getElementById('toggleText');
        const sheet = document.getElementById('bottomSheet');
        if (window.innerWidth >= 768) {
            text.innerText = '▼ 計算結果を閉じる';
            sheet.classList.remove('pc-closed');
        } else {
            text.innerText = '▲ 計算結果を見る';
            sheet.classList.remove('open');
        }
    }

    function toggleResultPanel() {
        const sheet = document.getElementById('bottomSheet');
        const text = document.getElementById('toggleText');
        
        if (window.innerWidth >= 768) {
            sheet.classList.toggle('pc-closed');
            text.innerText = sheet.classList.contains('pc-closed') ? '▲ 計算結果を開く' : '▼ 計算結果を閉じる';
        } else {
            sheet.classList.toggle('open');
            text.innerText = sheet.classList.contains('open') ? '▼ 閉じる' : '▲ 計算結果を見る';
        }
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.classList.add("show");
        
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { 
            toast.classList.remove("show"); 
        }, 3000);
    }

    function changeZoom(amount) {
        zoomLevel = Math.max(0.5, Math.min(2.5, zoomLevel + amount));
        compare(false);
    }

    function resetZoom() {
        zoomLevel = 1.0;
        compare(false);
    }

    function getNum(id) {
        const val = document.getElementById(id).value;
        const num = parseFloat(val);
        return isNaN(num) ? 0 : num;
    }

    function calcDia(width, ratio, inch) {
        if(width <= 0 || ratio <= 0 || inch <= 0) return 0;
        return (width * (ratio / 100) * 2) + (inch * 25.4);
    }

    function updateViz(id, j, inset, spacer, camber, tWidth, tRatio, inch, isNew, showKnuckle, showLine) {
        const assembly = document.getElementById(id);
        const dia = calcDia(tWidth, tRatio, inch);
        if(dia === 0) return;

        const scale = 0.4; 
        const actualJWidth = (j + 1) * 25.4; 
        const wwPx = actualJWidth * scale;       
        const twPx = tWidth * scale;           
        const totalHPx = dia * scale;          
        const wheelHPx = (inch * 25.4) * scale;
        const sideHPx = (totalHPx - wheelHPx) / 2; 

        const maxWPx = Math.max(wwPx, twPx);
        const tireX1 = (maxWPx - twPx) / 2;
        const tireX2 = tireX1 + twPx;
        const wheelX1 = (maxWPx - wwPx) / 2;
        const wheelX2 = wheelX1 + wwPx;

        const polygonPath = `polygon(${tireX1}px 0px, ${tireX2}px 0px, ${wheelX2}px ${sideHPx}px, ${wheelX2}px ${sideHPx + wheelHPx}px, ${tireX2}px ${totalHPx}px, ${tireX1}px ${totalHPx}px, ${wheelX1}px ${sideHPx + wheelHPx}px, ${wheelX1}px ${sideHPx})`;
        const pointsStr = `${tireX1},0 ${tireX2},0 ${wheelX2},${sideHPx} ${wheelX2},${sideHPx + wheelHPx} ${tireX2},${totalHPx} ${tireX1},${totalHPx} ${wheelX1},${sideHPx + wheelHPx} ${wheelX1},${sideHPx}`;

        const color = isNew ? 'var(--new-spec-color)' : 'var(--compare-color)';
        const bgColor = isNew ? 'rgba(192, 41, 43, 0.6)' : 'rgba(41, 128, 185, 0.6)';

        const hubX = (maxWPx / 2) + (inset * scale) - (spacer * scale);
        const centerY = totalHPx / 2;

        assembly.style.width = maxWPx + 'px';
        assembly.style.height = totalHPx + 'px';
        assembly.style.transformOrigin = `${hubX}px ${centerY}px`;
        assembly.style.left = `calc(50% - ${hubX}px)`;
        assembly.style.top = `calc(50% - ${centerY}px)`; 
        
        assembly.style.transform = `rotate(-${camber}deg) scale(${zoomLevel})`;

        assembly.innerHTML = `
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: ${polygonPath};">
                <div style="position: absolute; left: ${wheelX1}px; top: ${sideHPx}px; width: ${wwPx}px; height: ${wheelHPx}px; background: ${bgColor};"></div>
            </div>
            <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; z-index: 10;">
                <polygon points="${pointsStr}" fill="none" stroke="${color}" stroke-width="0.5" />
                <line x1="${hubX}" y1="${centerY - 220}" x2="${hubX}" y2="${centerY + 220}" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 4" style="display: ${showLine ? 'block' : 'none'};"/>
                <g style="display: ${showKnuckle ? 'block' : 'none'};">
                    <line x1="${hubX}" y1="${centerY - 30}" x2="${hubX}" y2="${centerY + 30}" stroke="${color}" stroke-width="6" stroke-linecap="round"/>
                    <line x1="${hubX}" y1="${centerY}" x2="${hubX - 20}" y2="${centerY}" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
                    <line x1="${hubX - 20}" y1="${centerY}" x2="${hubX - 30}" y2="${centerY - 60}" stroke="${color}" stroke-width="4" stroke-linecap="round"/>
                    <line x1="${hubX - 20}" y1="${centerY}" x2="${hubX - 25}" y2="${centerY + 60}" stroke="${color}" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="${hubX - 30}" cy="${centerY - 60}" r="5" fill="${color}" />
                    <circle cx="${hubX - 25}" cy="${centerY + 60}" r="5" fill="${color}" />
                    <circle cx="${hubX - 20}" cy="${centerY}" r="6" fill="${color}" />
                </g>
            </svg>
        `;
    }

    function compare(isInputChange = false) {
        const c = { j: getNum('curJ'), i: getNum('curInset'), s: getNum('curSpacer'), a: getNum('curCamber'), tw: getNum('curTWidth'), tr: getNum('curTRatio'), ti: getNum('curTInch') };
        const n = { j: getNum('newJ'), i: getNum('newInset'), s: getNum('newSpacer'), a: getNum('newCamber'), tw: getNum('newTWidth'), tr: getNum('newTRatio'), ti: getNum('newTInch') };
        
        const isStrut = document.getElementById('isStrut').checked;
        const showHubLine = document.getElementById('showHubLine').checked;
        const modeLayered = document.getElementById('modeLayered').checked;
        const visualArea = document.getElementById('visualArea');
        visualArea.className = modeLayered ? 'visual-area mode-layered' : 'visual-area mode-side';

        const curDia = calcDia(c.tw, c.tr, c.ti);
        const newDia = calcDia(n.tw, n.tr, n.ti);

        updateViz('curAssembly', c.j, c.i, c.s, c.a, c.tw, c.tr, c.ti, false, !modeLayered, showHubLine);
        updateViz('newAssembly', n.j, n.i, n.s, n.a, n.tw, n.tr, n.ti, true, !modeLayered, showHubLine);
        
        const curActualW = (c.j + 1) * 25.4;
        const newActualW = (n.j + 1) * 25.4;
        
        const isCurStretched = c.tw < curActualW;
        const isNewStretched = n.tw < newActualW;
        const isStretched = isCurStretched || isNewStretched;

        if (isInputChange) {
            if (isStretched) {
                if (!document.getElementById('baseRim').checked) {
                    document.getElementById('baseRim').checked = true;
                    showToast("⚠️ 引っ張りタイヤ検知：自動で リム基準 に切り替えました");
                }
            } else {
                if (!document.getElementById('baseTire').checked) {
                    document.getElementById('baseTire').checked = true;
                    showToast("💡 標準タイヤ検知：自動で タイヤ基準 に切り替えました");
                }
            }
        }

        const calcBase = document.querySelector('input[name="calcBase"]:checked').value;
        const baseName = calcBase === 'rim' ? 'リム' : 'タイヤ';

        const curLipOutHub = (curActualW / 2) - c.i + c.s;
        const newLipOutHub = (newActualW / 2) - n.i + n.s;
        const curLipInHub = (curActualW / 2) + c.i - c.s;
        const newLipInHub = (newActualW / 2) + n.i - n.s;

        const curTireOutHub = (c.tw / 2) - c.i + c.s;
        const newTireOutHub = (n.tw / 2) - n.i + n.s;
        const curTireInHub = (c.tw / 2) + c.i - c.s;
        const newTireInHub = (n.tw / 2) + n.i - n.s;

        const curRimRadius = (c.ti * 25.4 / 2) + 12.7;
        const newRimRadius = (n.ti * 25.4 / 2) + 12.7;
        const curTireMidRadius = (c.ti * 25.4 / 2) + ((c.tw * c.tr / 100) / 2);
        const newTireMidRadius = (n.ti * 25.4 / 2) + ((n.tw * n.tr / 100) / 2);

        let curFinalOut, newFinalOut, curFinalIn, newFinalIn;

        if (calcBase === 'rim') {
            curFinalOut = curLipOutHub - (curRimRadius * Math.sin(c.a * Math.PI / 180));
            newFinalOut = newLipOutHub - (newRimRadius * Math.sin(n.a * Math.PI / 180));
            curFinalIn = curLipInHub + (isStrut ? 0 : (curRimRadius * Math.sin(c.a * Math.PI / 180)));
            newFinalIn = newLipInHub + (isStrut ? 0 : (newRimRadius * Math.sin(n.a * Math.PI / 180)));
        } else {
            curFinalOut = curTireOutHub - (curTireMidRadius * Math.sin(c.a * Math.PI / 180));
            newFinalOut = newTireOutHub - (newTireMidRadius * Math.sin(n.a * Math.PI / 180));
            curFinalIn = curTireInHub + (isStrut ? 0 : (curTireMidRadius * Math.sin(c.a * Math.PI / 180)));
            newFinalIn = newTireInHub + (isStrut ? 0 : (newTireMidRadius * Math.sin(n.a * Math.PI / 180)));
        }

        const diffOut = newFinalOut - curFinalOut;
        const diffIn = newFinalIn - curFinalIn;
        const diffHeight = (newDia - curDia) / 2;

        document.getElementById('textOuterTitle').innerText = `アウター側（${baseName}基準）`;
        document.getElementById('textInnerTitle').innerText = `インナー側（${baseName}基準）`;

        const outEl = document.getElementById('diffOuter');
        const absOutEl = document.getElementById('absOuter');
        outEl.innerText = diffOut >= 0 ? `+ ${diffOut.toFixed(1)} mm 外へ` : `- ${Math.abs(diffOut).toFixed(1)} mm 内へ`;
        outEl.style.color = diffOut >= 0 ? 'var(--accent-color)' : 'var(--compare-color)';
        absOutEl.innerText = `ハブ面〜${baseName}最外側の距離: ${newFinalOut.toFixed(1)} mm`;

        const inEl = document.getElementById('diffInner');
        const absInEl = document.getElementById('absInner');
        inEl.innerText = diffIn >= 0 ? `+ ${diffIn.toFixed(1)} mm 接近` : `- ${Math.abs(diffIn).toFixed(1)} mm 余裕増加`;
        inEl.style.color = diffIn >= 0 ? '#ffcc00' : '#00ff7f';
        absInEl.innerText = `ハブ面〜${baseName}最内側の距離: ${newFinalIn.toFixed(1)} mm`;

        const heightEl = document.getElementById('diffHeight');
        if (diffHeight === 0) {
            heightEl.innerText = `± 0.0 mm`;
            heightEl.style.color = '#fff';
        } else if (diffHeight > 0) {
            heightEl.innerText = `+ ${diffHeight.toFixed(1)} mm 上がる`;
            heightEl.style.color = '#ffcc00';
        } else {
            heightEl.innerText = `- ${Math.abs(diffHeight).toFixed(1)} mm 下がる`;
            heightEl.style.color = '#00ff7f';
        }
    }

    const inputIds = ['curJ','curInset','curSpacer','curCamber','curTWidth','curTRatio','curTInch','newJ','newInset','newSpacer','newCamber','newTWidth','newTRatio','newTInch'];
    inputIds.forEach(id => document.getElementById(id).addEventListener('input', () => compare(true)));

    document.getElementById('isStrut').addEventListener('change', () => compare(false));
    document.getElementById('showHubLine').addEventListener('change', () => compare(false));
    document.getElementsByName('calcBase').forEach(radio => radio.addEventListener('change', () => compare(false)));
    document.getElementsByName('viewMode').forEach(radio => radio.addEventListener('change', () => compare(false)));
    
    compare(true);
</script>

</body>
</html>
